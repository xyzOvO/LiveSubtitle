org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 在 Windows 对非 ASCII 项目路径会拒绝构建；本工程原始目录含中文。
# 正式出包仍复制到 D:/androiddev/build/LiveSubtitleAndroid（纯 ASCII）执行，
# 这一行只用于让 IDE/Gradle 配置阶段不被路径检查拦住。
android.overridePathCheck=true

# 650MB 未压缩模型资产并行压缩/打包时容易吃满 worker 内存；控制并发并给足堆。
org.gradle.workers.max=2
org.gradle.parallel=false
